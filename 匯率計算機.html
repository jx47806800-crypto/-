<!DOCTYPE html>
<html>
<head>
	<title>匯率計算機</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<style>
		.container {
		width: 300px;
		margin: auto;
		color: #555555;
	}

	/* 表格間的間格 */
	.form-control {
		position: relative;
		margin-top: 40px;
	}

	span {
		color: #7777777;
		font-size: 14px;
		transition: 2s;
	}

	input {
		height: 40px;
		padding: 5px;
		font-size: 16px;
		text-align: right;
		
		border-width: 0px;
		border-bottom: 2px solid #030303;
		outline: none;
		transition: 2s;
	 }
	input:focus{
		border-color: #0331ff;
	}
	input:focus + span{
		color: blue;
	}
	</style>
</head>
<body>
    <div class="container">
        <h1>匯率計算機</h1>
        
        <div class="form-control">
            <input id="ntd">
            <span>台幣 (NTD)</span>
        </div>
<!--         <button id="ntd-btn">換算</button> -->
        
        <div class="form-control">
            <input id="jpy">
            <span>日幣 (JPY)</span>
        </div>
<!--         <button id="jpy-btn">換算</button> -->
        
        <div class="form-control">
            <input id="usd">
            <span>美元 (USD)</span>
        </div >
<!--         <button id="usd-btn">換算</button> -->
        
    </div>
	<script>
		// 按鈕觸發
		$("#ntd").keyup(ntd_to_else);
		$("#jpy").keyup(jpy_to_else);
		$("#usd").keyup(usd_to_else);
		// 功能
		function ntd_to_else () {
			var ntd = $("#ntd").val();
			var usd = (ntd / 31.51800).toFixed(3);
			var jpy = (ntd / 22.57800).toFixed(3);
			$("#usd").val(usd);
			$("#jpy").val(jpy);
		}

		function jpy_to_else () {
			var jpy = $("#jpy").val();
			var ntd = (jpy * 0.20460).toFixed(3);
			var usd = (jpy * 0.20460 / 31.51800).toFixed(3);
			$("#usd").val(usd);
			$("#ntd").val(ntd);
		}

		function usd_to_else () {
			var usd = $("#usd").val();
			var ntd = (usd * 32.03300).toFixed(3);
			var jpy = (usd * 32.03300 / 0.19720).toFixed(3);
			$("#ntd").val(ntd);
			$("#jpy").val(jpy);
		}

	</script>
</body>
</html>
